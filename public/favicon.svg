<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Background Shadow for app icon container -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="512" height="512" rx="112" fill="#f8fafc" />

  <!-- Geometric Isometric Hollow Cube with Glowing Amber Core -->
  <g transform="translate(0, 0)">
    <!-- Soft Floor Drop Shadow -->
    <ellipse cx="256" cy="435" rx="145" ry="32" fill="#0f172a" opacity="0.12" />

    <!-- === INNER ORANGE / AMBER CUBE (Visible through hollow windows) === -->
    <!-- Inner Cube Left Face -->
    <polygon points="186,248 256,288 256,368 186,328" fill="#fb8c00" />
    <!-- Inner Cube Right Face -->
    <polygon points="256,288 326,248 326,328 256,368" fill="#e65100" />
    <!-- Inner Cube Top Face -->
    <polygon points="256,208 326,248 256,288 186,248" fill="#ffb300" />

    <!-- === OUTER SLATE FRAME - WINDOW REVEAL THICKNESSES (Depth jambs) === -->
    <!-- Top window inner right reveal -->
    <polygon points="328,183 328,248 256,288 256,223" fill="#50555e" opacity="0.9" />
    <!-- Top window inner left reveal -->
    <polygon points="184,183 256,223 256,288 186,248" fill="#3a3c42" opacity="0.9" />

    <!-- Left window inner top reveal -->
    <polygon points="158,226 224,264 224,284 158,246" fill="#757a84" />
    <!-- Left window inner right reveal -->
    <polygon points="224,264 224,342 256,324 256,288" fill="#2b2d33" opacity="0.8" />

    <!-- Right window inner top reveal -->
    <polygon points="288,264 354,226 354,246 288,284" fill="#50555e" />
    <!-- Right window inner left reveal -->
    <polygon points="288,264 288,342 256,324 256,288" fill="#757a84" opacity="0.85" />

    <!-- === OUTER SLATE FRAME FACES (Cutout frames with windows) === -->
    <!-- 1. Top Outer Face (Medium Grey #757b85) with window cutout -->
    <path d="M 256 100 L 388 176 L 256 252 L 124 176 Z M 256 142 L 184 183 L 256 224 L 328 183 Z"
          fill="#757b85"
          fill-rule="evenodd" />

    <!-- 2. Left Outer Face (Darker Grey #50555e) with window cutout -->
    <path d="M 124 176 L 256 252 L 256 404 L 124 328 Z M 158 226 L 224 264 L 224 342 L 158 304 Z"
          fill="#50555e"
          fill-rule="evenodd" />

    <!-- 3. Right Outer Face (Darkest Slate #2b2d33) with window cutout -->
    <path d="M 256 252 L 388 176 L 388 328 L 256 404 Z M 288 264 L 354 226 L 354 304 L 288 342 Z"
          fill="#2b2d33"
          fill-rule="evenodd" />
  </g>
</svg>
